<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendas - JS GRUPO</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/pagamentos.css">
</head>
<body class="pag-app">
<div class="app"><main class="main" style="display:flex">
  <header class="topbar"><div class="tb-title"><span class="eyebrow">JS Grupo · Vendas</span><h1>Lançamento de solicitações</h1></div></header>
  <main class="content">
    <section id="loginView" class="card" style="max-width:460px;margin:40px auto;padding:28px">
      <div class="view-head"><div><h2>Acesso Vendas</h2><p>Entre com o usuário da unidade ou da gerência.</p></div></div>
      <form id="loginForm">
        <label class="pag-field"><span>Usuário</span><input id="loginUser" required autocomplete="username"></label>
        <label class="pag-field"><span>Senha</span><input id="loginPassword" type="password" required autocomplete="current-password"></label>
        <p id="loginError" class="pag-error hidden"></p>
        <button class="btn-primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="appView" class="hidden">
      <div class="view-head"><div><span class="eyebrow" id="identity"></span><h2 id="scopeTitle">Minhas vendas</h2></div><button id="logoutBtn" class="btn-secondary" type="button">Sair</button></div>
      <div id="unitCards" class="pag-unit-cards hidden"></div>
      <form id="saleForm" class="card" style="padding:20px;margin-bottom:20px">
        <h3>Nova solicitação de confirmação</h3>
        <div class="form-grid">
          <label class="pag-field"><span>Cliente</span><input name="cliente" required></label>
          <label class="pag-field"><span>CPF</span><input name="cpf"></label>
          <label class="pag-field"><span>Modelo</span><select name="modelo" required><option value="">Selecione</option><option>AZ1</option><option>AZ125</option><option>AZ160</option></select></label>
          <label class="pag-field"><span>Valor financiado</span><input name="valorFinanciado" type="number" min="0" step="0.01" required></label>
          <label class="pag-field"><span>Valor entrada</span><input name="valorEntrada" type="number" min="0" step="0.01" required></label>
          <label class="pag-field"><span>Forma da entrada</span><input name="formaPagamento" required></label>
          <label class="pag-field"><span>Banco financiamento</span><input name="bancoFinanciamento"></label>
          <label class="pag-field"><span>Vendedor</span><input name="vendedor"></label>
          <label class="pag-field"><span>Cidade</span><input name="cidade"></label>
          <label class="pag-field"><span>Chassi</span><input name="chassi"></label>
        </div>
        <p id="formMessage" class="pag-error hidden"></p>
        <button class="btn-primary" type="submit">Lançar solicitação</button>
      </form>
      <div id="salesList"></div>
    </section>
  </main>
</main></div>
<script src="js/pagamentos-config.js"></script>
<script src="js/pagamentos-api.js"></script>
<script>
const sessionKey = 'jsgrupo_vendas_session';
let session = null;
let rows = [];
const $ = id => document.getElementById(id);
function escText(value) { return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function api(action, payload) { return PagApi.request(action, payload); }
function restore() { try { session = JSON.parse(sessionStorage.getItem(sessionKey)); } catch (_) { session = null; } }
function showApp() { $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden'); $('identity').textContent = `${session.usuario} · ${session.perfil}${session.unidade ? ' · ' + session.unidade : ''}`; $('scopeTitle').textContent = session.perfil === 'UNIDADE' ? `Vendas de ${session.unidade}` : 'Todas as unidades'; $('saleForm').classList.toggle('hidden', session.perfil === 'FINANCEIRO'); }
async function loadRows() { const result = await api('vendasList', session); rows = result.data || []; renderRows(); }
function renderRows() { $('salesList').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="pag-table"><thead><tr><th>Cliente</th><th>Unidade</th><th>Modelo</th><th>Valor</th><th>Status</th><th>Edição</th><th>Ação</th></tr></thead><tbody>${rows.map(row => `<tr><td><b>${escText(row.cliente)}</b><div class="row-sub">${escText(row.cpf)}</div></td><td>${escText(row.unidade)}</td><td>${escText(row.modelo)}</td><td>${formatCurrency(row.valorFinanciado || row.valor)}</td><td>${escText(row.status)}</td><td>${escText(row.statusEdicao || '-')}</td><td>${session.perfil === 'UNIDADE' ? `<button class="btn-secondary" data-edit="${escText(row.id)}" type="button">Pedir correção</button>` : row.statusEdicao === 'SOLICITACAO DE EDICAO' ? `<button class="btn-primary" data-approve="${escText(row.id)}" type="button">Aprovar edição</button>` : '-'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty-state">Nenhuma venda encontrada.</div>'; document.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', requestEdit)); document.querySelectorAll('[data-approve]').forEach(button => button.addEventListener('click', approveEdit)); }
async function requestEdit(event) { const id = event.currentTarget.dataset.edit; const motivo = prompt('Informe o que precisa ser corrigido:'); if (!motivo) return; try { await api('vendasRequestEdit', {...session, id, motivo}); await loadRows(); } catch (error) { alert(error.message); } }
async function approveEdit(event) { const id = event.currentTarget.dataset.approve; const changes = {}; const valor = prompt('Novo valor financiado (deixe vazio para não alterar):'); if (valor) changes.ValorFinanciado = Number(valor); try { await api('vendasApproveEdit', {...session, id, changes: JSON.stringify(changes)}); await loadRows(); } catch (error) { alert(error.message); } }
$('loginForm').addEventListener('submit', async event => { event.preventDefault(); $('loginError').classList.add('hidden'); try { const result = await api('vendasLogin', { usuario: $('loginUser').value, senha: $('loginPassword').value }); session = result.data; session.senha = $('loginPassword').value; sessionStorage.setItem(sessionKey, JSON.stringify(session)); showApp(); await loadRows(); } catch (error) { $('loginError').textContent = error.message; $('loginError').classList.remove('hidden'); } });
$('saleForm').addEventListener('submit', async event => { event.preventDefault(); const form = new FormData(event.currentTarget); const payload = Object.fromEntries(form.entries()); try { await api('vendasCreate', {...session, ...payload}); event.currentTarget.reset(); $('formMessage').textContent = 'Solicitação lançada com sucesso.'; $('formMessage').classList.remove('hidden'); await loadRows(); } catch (error) { $('formMessage').textContent = error.message; $('formMessage').classList.remove('hidden'); } });
$('logoutBtn').addEventListener('click', () => { sessionStorage.removeItem(sessionKey); location.reload(); });
restore(); if (session) { showApp(); loadRows().catch(error => alert(error.message)); }
</script>
</body>
</html>
