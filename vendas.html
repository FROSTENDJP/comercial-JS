<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendas - JS GRUPO</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/pagamentos.css">
</head>
<body class="pag-app">
<div class="app">
  <div class="sb-overlay" id="sbOverlay"></div>
  <div id="sidebarMount"></div>
  <div class="main" id="mainApp" style="display:none">
    <header class="topbar">
      <button class="hamburger" id="hamburger" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="tb-title">
        <span class="eyebrow">JS Grupo · Vendas</span>
        <h1>Solicitações de confirmação</h1>
      </div>
    </header>
    <main class="content">
      <div class="view-head">
        <div>
          <h2 id="scopeTitle">Todas as unidades</h2>
          <p>Cadastre solicitações de pagamento e acompanhe o status solicitado pelos usuários comerciais.</p>
        </div>
        <span class="chip gold" id="userChip">Usuário Comercial</span>
      </div>
      <div class="kpi-row" id="kpiRow"></div>

      <section id="saleFormSection" class="card" style="padding:20px;margin-bottom:20px">
        <div class="view-head"><div><h3>Nova solicitação de confirmação</h3></div></div>
        <form id="saleForm">
          <div class="form-grid">
            <label class="pag-field"><span>Cliente</span><input name="cliente" required></label>
            <label class="pag-field"><span>CPF</span><input name="cpf"></label>
            <label class="pag-field"><span>Modelo</span><select name="modelo" required><option value="">Selecione</option><option>AZ1</option><option>AZ125</option><option>AZ160</option></select></label>
            <label class="pag-field"><span>Valor financiado</span><input name="valorFinanciado" type="number" min="0" step="0.01" required></label>
            <label class="pag-field"><span>Valor entrada</span><input name="valorEntrada" type="number" min="0" step="0.01" required></label>
            <label class="pag-field"><span>Forma da entrada</span><input name="formaPagamento" required></label>
            <label class="pag-field"><span>Banco financiamento</span><input name="bancoFinanciamento"></label>
            <label class="pag-field"><span>Vendedor</span><input name="vendedor"></label>
            <label class="pag-field"><span>Cidade</span><input name="cidade"></label>
            <label class="pag-field"><span>Chassi</span><input name="chassi"></label>
          </div>
          <p id="formMessage" class="pag-error hidden"></p>
          <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
            <button class="btn-primary" type="submit">Lançar solicitação</button>
          </div>
        </form>
      </section>

      <div id="salesList"></div>
    </main>
  </div>
</div>

<section id="loginView" class="card" style="max-width:560px;margin:80px auto;padding:34px;display:block">
  <div class="view-head"><div><h2>Acesso Vendas</h2><p>Entre com o usuário comercial ou da unidade.</p></div></div>
  <form id="loginForm">
    <label class="pag-field"><span>Usuário</span><input id="loginUser" required autocomplete="username"></label>
    <label class="pag-field"><span>Senha</span><input id="loginPassword" type="password" required autocomplete="current-password"></label>
    <p id="loginError" class="pag-error hidden"></p>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
      <a class="btn-secondary" href="index.html">Voltar aos setores</a>
      <button class="btn-primary" type="submit">Entrar</button>
    </div>
  </form>
</section>

<script src="js/pagamentos-config.js"></script>
<script src="js/pagamentos-auth.js"></script>
<script src="js/pagamentos-api.js"></script>
<script src="js/pagamentos-components.js"></script>
<script src="js/pagamentos-shell.js"></script>
<script>
const sessionKey = 'jsgrupo_vendas_session';
let session = null;
let rows = [];
const $ = id => document.getElementById(id);

function escText(value) { return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function api(action, payload) { return PagApi.request(action, payload); }
function restore() { try { session = JSON.parse(sessionStorage.getItem(sessionKey)); } catch (_) { session = null; } }

function normalizeProfile(profile) {
  const value = String(profile || '').trim().toUpperCase();
  return value === 'COMERCIAL' ? 'UNIDADE' : value;
}

function canCreateSales() {
  return ['UNIDADE'].includes(normalizeProfile(session && session.perfil));
}

function showApp() {
  const perfil = normalizeProfile(session && session.perfil);
  $('loginView').style.display = 'none';
  $('mainApp').style.display = 'flex';
  $('userChip').textContent = perfil === 'GERENCIA' ? 'Acesso Gerência' : 'Usuário Comercial';
  $('scopeTitle').textContent = perfil === 'UNIDADE' ? `Vendas de ${session.unidade || 'Unidade'}` : 'Todas as unidades';
  $('saleFormSection').style.display = canCreateSales() ? 'block' : 'none';
}

async function loadRows() {
  const result = await api('vendasList', session);
  rows = result.data || [];
  renderRows();
  renderKpis();
}

function renderKpis() {
  const total = rows.length;
  const pend = rows.filter(v => v.status === 'AGUARDANDO CONFIRMACAO').length;
  const ok = rows.filter(v => ['PAGAMENTO OK', 'CONCLUIDO'].includes(v.status)).length;
  const valor = rows.reduce((s, v) => s + Number(v.valorFinanciado || v.valor || 0), 0);
  $('kpiRow').innerHTML = `
    <div class="kpi-card"><div class="lbl">Total</div><div class="val">${total}</div></div>
    <div class="kpi-card" style="--accent:#16A34A"><div class="lbl">Confirmados</div><div class="val">${ok}</div></div>
    <div class="kpi-card" style="--accent:#DC2626"><div class="lbl">Aguardando</div><div class="val">${pend}</div></div>
    <div class="kpi-card" style="--accent:#FF6B00"><div class="lbl">Valor Total</div><div class="val" style="font-size:22px">${formatCurrency(valor)}</div></div>`;
}

function renderRows() {
  const perfil = normalizeProfile(session && session.perfil);
  $('salesList').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="pag-table"><thead><tr><th>Cliente</th><th>Unidade</th><th>Modelo</th><th>Valor</th><th>Status</th><th>Edição</th><th>Ação</th></tr></thead><tbody>${rows.map(row => `<tr><td><b>${escText(row.cliente)}</b><div class="row-sub">${escText(row.cpf)}</div></td><td>${escText(row.unidade)}</td><td>${escText(row.modelo)}</td><td>${formatCurrency(row.valorFinanciado || row.valor)}</td><td>${escText(row.status)}</td><td>${escText(row.statusEdicao || '-')}</td><td>${perfil === 'UNIDADE' ? `<button class="btn-secondary" data-edit="${escText(row.id)}" type="button">Solicitar edição</button>` : perfil === 'GERENCIA' && row.statusEdicao === 'SOLICITACAO DE EDICAO' ? `<button class="btn-primary" data-approve="${escText(row.id)}" type="button">Aprovar edição</button>` : 'Somente leitura'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty-state">Nenhuma venda encontrada.</div>';
  document.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', requestEdit));
  document.querySelectorAll('[data-approve]').forEach(button => button.addEventListener('click', approveEdit));
}

async function requestEdit(event) {
  const id = event.currentTarget.dataset.edit;
  const motivo = prompt('Informe o que precisa ser corrigido:');
  if (!motivo) return;
  try {
    await api('vendasRequestEdit', { ...session, id, motivo });
    await loadRows();
  } catch (error) { alert(error.message); }
}

async function approveEdit(event) {
  const id = event.currentTarget.dataset.approve;
  const changes = {};
  const valor = prompt('Novo valor financiado (deixe vazio para não alterar):');
  if (valor) changes.ValorFinanciado = Number(valor);
  try {
    await api('vendasApproveEdit', { ...session, id, changes: JSON.stringify(changes) });
    await loadRows();
  } catch (error) { alert(error.message); }
}

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  $('loginError').classList.add('hidden');
  try {
    const result = await api('vendasLogin', { usuario: $('loginUser').value, senha: $('loginPassword').value });
    session = result.data;
    session.senha = $('loginPassword').value;
    sessionStorage.setItem(sessionKey, JSON.stringify(session));
    showApp();
    await loadRows();
  } catch (error) {
    $('loginError').textContent = error.message;
    $('loginError').classList.remove('hidden');
  }
});

$('saleForm').addEventListener('submit', async event => {
  event.preventDefault();
  const form = new FormData(event.currentTarget);
  const payload = Object.fromEntries(form.entries());
  try {
    if (!canCreateSales()) throw new Error('Seu perfil não pode lançar solicitações.');
    await api('vendasCreate', { ...session, ...payload });
    event.currentTarget.reset();
    $('formMessage').textContent = 'Solicitação lançada com sucesso.';
    $('formMessage').classList.remove('hidden');
    await loadRows();
  } catch (error) {
    $('formMessage').textContent = error.message;
    $('formMessage').classList.remove('hidden');
  }
});

restore();
if (session) {
  document.getElementById('sidebarMount').innerHTML = renderPagSidebar('vendas');
  bindPagMobileNav();
  bindPagLogout();
  showApp();
  loadRows().catch(error => alert(error.message));
} else {
  document.getElementById('sidebarMount').innerHTML = renderPagSidebar('vendas');
  bindPagMobileNav();
  bindPagLogout();
}

document.getElementById('logoutBtn')?.addEventListener('click', () => { sessionStorage.removeItem(sessionKey); location.reload(); });
</script>
</body>
</html>
