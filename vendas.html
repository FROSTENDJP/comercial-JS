<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendas — JS GRUPO</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/pagamentos.css">
</head>
<body class="pag-app">
<div class="app">
  <div class="sb-overlay" id="sbOverlay"></div>
  <div id="sidebarMount"></div>
  <div class="main" id="mainApp" style="display:none">
    <header class="topbar">
      <button class="hamburger" id="hamburger" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="tb-title">
        <span class="eyebrow">JS Grupo · Vendas</span>
        <h1 id="pageTitle">Lançamento de Vendas</h1>
      </div>
    </header>
    <main class="content">
      <div class="view-head">
        <div>
          <h2 id="viewTitle">Minhas vendas</h2>
          <p id="viewSubtitle">Solicitações de confirmação de pagamento da sua unidade.</p>
        </div>
      </div>

      <!-- Visível apenas para perfil GERENCIA: visão de todas as unidades, igual ao gerentes.html -->
      <div class="pag-unit-cards" id="unitCards" style="display:none"></div>

      <div class="kpi-row" id="kpiRow"></div>

      <!-- Visível apenas para perfil UNIDADE: lançamento de novas solicitações. -->
      <!-- Card retrátil: fica fechado por padrão e expande ao clicar, em vez -->
      <!-- de ficar fixo ocupando espaço na tela (ver initCollapsible() abaixo). -->
      <section id="saleFormSection" class="card pag-collapsible" style="display:none">
        <button type="button" class="pag-collapsible-toggle" id="saleFormToggle" aria-expanded="false">
          <div><h3>Nova solicitação de confirmação</h3><p class="row-sub">Clique para preencher os dados da venda</p></div>
          <svg class="pag-collapsible-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="pag-collapsible-body" id="saleFormBody">
          <div class="pag-collapsible-inner">
            <form id="saleForm">
              <div class="form-grid">
                <label class="pag-field"><span>Cliente</span><input name="cliente" required></label>
                <label class="pag-field"><span>CPF</span><input name="cpf"></label>
                <label class="pag-field"><span>Modelo</span>
                  <select name="modelo" required>
                    <option value="">Selecione</option>
                    <option>AZ1</option>
                    <option>AZ125</option>
                    <option>AZ160</option>
                  </select>
                </label>
                <label class="pag-field"><span>Valor financiado</span>
                  <div class="pag-money-wrap"><span class="pag-money-prefix">R$</span><input name="valorFinanciado" class="pag-money-input" inputmode="decimal" autocomplete="off" placeholder="0,00" required></div>
                </label>
                <label class="pag-field"><span>Valor entrada</span>
                  <div class="pag-money-wrap"><span class="pag-money-prefix">R$</span><input name="valorEntrada" class="pag-money-input" inputmode="decimal" autocomplete="off" placeholder="0,00" required></div>
                </label>
                <label class="pag-field"><span>Forma da entrada</span><input name="formaPagamento" required></label>
                <label class="pag-field"><span>Banco financiamento</span><input name="bancoFinanciamento"></label>
                <label class="pag-field"><span>Vendedor</span>
                  <select name="vendedor" id="vendedorSelect" required>
                    <option value="">Selecione</option>
                  </select>
                </label>
                <label class="pag-field"><span>Cidade</span><input name="cidade"></label>
                <label class="pag-field"><span>Chassi</span><input name="chassi"></label>
              </div>
              <p id="formMessage" class="pag-error hidden"></p>
              <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
                <button class="btn-secondary" type="button" id="saleFormCancel">Cancelar</button>
                <button class="btn-primary" type="submit">Lançar solicitação</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- Visível apenas para perfil GERENCIA: cadastro e gestão de colaboradores por unidade -->
      <section id="colabSection" class="card pag-collapsible" style="display:none">
        <button type="button" class="pag-collapsible-toggle" id="colabToggle" aria-expanded="false">
          <div><h3>Gestão de Colaboradores</h3><p class="row-sub">Cadastre vendedores e vincule cada um a uma unidade</p></div>
          <svg class="pag-collapsible-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="pag-collapsible-body" id="colabBody">
          <div class="pag-collapsible-inner">
            <form id="colabForm">
              <div class="form-grid">
                <label class="pag-field"><span>Nome do colaborador</span><input name="nome" required></label>
                <label class="pag-field"><span>Unidade</span>
                  <select name="unidade" required>
                    <option value="">Selecione</option>
                    <option value="mamanguape">Mamanguape</option>
                    <option value="guarabira">Guarabira</option>
                    <option value="patos-centro">Patos (Centro)</option>
                    <option value="patos-cd">Patos (CD)</option>
                    <option value="natal">Natal</option>
                    <option value="joao-pessoa">João Pessoa (Matriz)</option>
                    <option value="parnamirim">Parnamirim</option>
                    <option value="sape">Sapé</option>
                    <option value="pombal">Pombal</option>
                    <option value="sao-bento">São Bento</option>
                  </select>
                </label>
              </div>
              <p id="colabMessage" class="pag-error hidden"></p>
              <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
                <button class="btn-secondary" type="button" id="colabFormCancel">Fechar</button>
                <button class="btn-primary" type="submit">Adicionar colaborador</button>
              </div>
            </form>
            <div id="colabList" style="margin-top:18px"><div class="empty-state">Carregando...</div></div>
          </div>
        </div>
      </section>

      <div id="vendasList"><div class="empty-state">Carregando...</div></div>
    </main>
  </div>
</div>
<script src="js/pagamentos-config.js"></script>
<script src="js/pagamentos-auth.js"></script>
<script src="js/pagamentos-api.js"></script>
<script src="js/pagamentos-components.js"></script>
<script src="js/pagamentos-shell.js"></script>
<script>
let session = null;
let currentUnidade = '';
let allVendas = [];
let allColaboradores = [];

function init() {
  if (!PagAuth.isLoggedIn('vendas')) { window.location.href = PAGAMENTOS_CONFIG.PAGES.index; return; }
  session = PagAuth.getSession();

  document.getElementById('sidebarMount').innerHTML = renderPagSidebar('vendas');
  document.getElementById('mainApp').style.display = 'flex';
  bindPagMobileNav(); bindPagLogout();

  const isUnidade = session.perfil === 'UNIDADE';
  const isGerencia = session.perfil === 'GERENCIA';
  const unidadeMeta = session.unidade ? getUnidadeMeta(session.unidade) : null;

  document.getElementById('pageTitle').textContent = isUnidade ? 'Lançamento de Vendas' : 'Aprovação de Edições — Vendas';
  document.getElementById('viewTitle').textContent = isUnidade
    ? (unidadeMeta ? `Vendas de ${unidadeMeta.nome}` : 'Minhas vendas')
    : 'Todas as unidades';
  document.getElementById('viewSubtitle').textContent = isUnidade
    ? 'Lance novas solicitações e acompanhe o status das confirmações da sua unidade.'
    : 'Acompanhe as solicitações de todas as unidades, aprove pedidos de correção e gerencie os colaboradores das lojas.';

  document.getElementById('saleFormSection').style.display = isUnidade ? 'block' : 'none';
  document.getElementById('colabSection').style.display = isGerencia ? 'block' : 'none';
  document.getElementById('unitCards').style.display = isUnidade ? 'none' : 'grid';

  if (isUnidade) {
    document.getElementById('saleForm').addEventListener('submit', handleCreateSale);
    document.getElementById('saleFormCancel').addEventListener('click', () => {
      document.getElementById('saleForm').reset();
      document.getElementById('formMessage').classList.add('hidden');
      closeCollapsible(document.getElementById('saleFormToggle'), document.getElementById('saleFormBody'));
    });
    initCollapsible(document.getElementById('saleFormToggle'), document.getElementById('saleFormBody'), { onOpen: loadColaboradoresForForm });
    attachCurrencyMask(document.querySelector('#saleForm [name="valorFinanciado"]'));
    attachCurrencyMask(document.querySelector('#saleForm [name="valorEntrada"]'));
    loadColaboradoresForForm();
  }

  if (isGerencia) {
    document.getElementById('colabForm').addEventListener('submit', handleCreateColab);
    document.getElementById('colabFormCancel').addEventListener('click', () => {
      document.getElementById('colabForm').reset();
      document.getElementById('colabMessage').classList.add('hidden');
      closeCollapsible(document.getElementById('colabToggle'), document.getElementById('colabBody'));
    });
    initCollapsible(document.getElementById('colabToggle'), document.getElementById('colabBody'));
    loadColaboradores();
  }

  loadData();
}

// Busca os dados via a rota vendasList (não listPagamentos!): é ela quem já
// filtra no backend, pela unidade gravada na aba Usuarios do usuário logado,
// sem depender de nenhum parâmetro enviado pelo cliente.
async function loadData() {
  document.getElementById('vendasList').innerHTML = '<div class="empty-state">Carregando...</div>';
  try {
    const res = await PagApi.request('vendasList', {});
    allVendas = (res.data || []).filter(v => v.formType === 'cliente');
    if (session.perfil !== 'UNIDADE') renderUnitCards();
    renderStats();
    renderList();
  } catch (e) {
    document.getElementById('vendasList').innerHTML = `<div class="empty-state">Erro: ${esc(e.message)}</div>`;
  }
}

function renderUnitCards() {
  document.getElementById('unitCards').innerHTML = PAGAMENTOS_CONFIG.UNIDADES.map(u => {
    const vs = allVendas.filter(v => v.unidade === u.id);
    const ok = vs.filter(v => ['PAGAMENTO OK', 'CONCLUIDO'].includes(v.status)).length;
    const pend = vs.filter(v => v.status === 'AGUARDANDO CONFIRMACAO').length;
    return `<div class="pag-unit-card ${currentUnidade === u.id ? 'active' : ''}" data-u="${u.id}">
      <h3>${esc(u.nome)}</h3>
      <div class="stats"><div><strong>${vs.length}</strong>Total</div><div><strong style="color:var(--green)">${ok}</strong>OK</div><div><strong style="color:var(--red)">${pend}</strong>Pend.</div></div>
    </div>`;
  }).join('');
  document.querySelectorAll('.pag-unit-card').forEach(c => c.addEventListener('click', () => {
    currentUnidade = currentUnidade === c.dataset.u ? '' : c.dataset.u;
    document.getElementById('viewTitle').textContent = currentUnidade ? getUnidadeMeta(currentUnidade).nome : 'Todas as unidades';
    renderUnitCards(); renderStats(); renderList();
  }));
}

// Perfil UNIDADE já recebe do backend somente a própria unidade — não há
// filtro extra a aplicar aqui. Perfil GERENCIA pode recortar por unidade
// clicando nos cards, igual ao gerentes.html.
function filtered() {
  if (session.perfil === 'UNIDADE') return allVendas;
  return currentUnidade ? allVendas.filter(v => v.unidade === currentUnidade) : allVendas;
}

function renderStats() {
  const rows = filtered();
  const conf = rows.filter(v => ['PAGAMENTO OK', 'CONCLUIDO'].includes(v.status)).length;
  const pend = rows.filter(v => v.status === 'AGUARDANDO CONFIRMACAO').length;
  const totalVal = rows.reduce((s, v) => s + (Number(v.valorFinanciado || v.valor) || 0), 0);
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card"><div class="lbl">Total</div><div class="val">${rows.length}</div></div>
    <div class="kpi-card" style="--accent:#16A34A"><div class="lbl">Confirmados</div><div class="val">${conf}</div></div>
    <div class="kpi-card" style="--accent:#DC2626"><div class="lbl">Aguardando</div><div class="val">${pend}</div></div>
    <div class="kpi-card" style="--accent:#FF6B00"><div class="lbl">Valor Total</div><div class="val" style="font-size:22px">${formatCurrency(totalVal)}</div></div>`;
}

function renderList() {
  const box = document.getElementById('vendasList');
  box.innerHTML = '';
  box.appendChild(renderPagTable(filtered(), id => openDetail(id)));
}

function openDetail(id) {
  const v = allVendas.find(x => x.id === id);
  if (!v) return;
  renderPagDetail(v, { editable: false });
  const overlays = document.querySelectorAll('.pag-detail-overlay');
  attachVendasActions(overlays[overlays.length - 1], v);
}

// Acrescenta as ações específicas de Vendas (pedir correção / aprovar edição)
// ao painel de detalhe padrão, sem alterar pagamentos-components.js — assim
// Financeiro e Gerentes continuam exatamente como estão hoje.
function attachVendasActions(overlay, v) {
  if (!overlay) return;
  const panel = overlay.querySelector('.pag-detail-panel');
  if (!panel) return;
  const bar = document.createElement('div');
  bar.className = 'pag-detail-foot';

  if (session.perfil === 'UNIDADE' && v.statusEdicao !== 'SOLICITACAO DE EDICAO') {
    bar.innerHTML = `<button class="btn-secondary" id="btnPedirCorrecao" type="button" style="width:100%">Pedir correção</button>`;
    panel.appendChild(bar);
    bar.querySelector('#btnPedirCorrecao').addEventListener('click', () => requestEdit(v.id, overlay));
  } else if (session.perfil === 'GERENCIA' && v.statusEdicao === 'SOLICITACAO DE EDICAO') {
    bar.innerHTML = `<button class="btn-primary" id="btnAprovarEdicao" type="button" style="width:100%">Aprovar edição</button>`;
    panel.appendChild(bar);
    bar.querySelector('#btnAprovarEdicao').addEventListener('click', () => approveEdit(v.id, overlay));
  }
}

async function requestEdit(id, overlay) {
  const motivo = prompt('Informe o que precisa ser corrigido:');
  if (!motivo) return;
  try {
    await PagApi.request('vendasRequestEdit', { id, motivo });
    overlay.remove();
    await loadData();
  } catch (err) { alert(err.message); }
}

async function approveEdit(id, overlay) {
  const valor = prompt('Novo valor financiado (deixe vazio para não alterar):');
  const changes = {};
  if (valor) changes.ValorFinanciado = Number(valor);
  try {
    await PagApi.request('vendasApproveEdit', { id, changes: JSON.stringify(changes) });
    overlay.remove();
    await loadData();
  } catch (err) { alert(err.message); }
}

// ---------------------------------------------------------------
// Card retrátil (accordion) — usado pelo formulário de lançamento
// (perfil UNIDADE) e pela gestão de colaboradores (perfil GERENCIA).
// Mantido isolado aqui, sem tocar em pagamentos-shell.js, para não
// impactar Financeiro/Gerentes, que também carregam esse arquivo.
// ---------------------------------------------------------------
function initCollapsible(toggleEl, bodyEl, opts) {
  opts = opts || {};
  toggleEl.addEventListener('click', () => {
    if (bodyEl.classList.contains('open')) {
      closeCollapsible(toggleEl, bodyEl);
    } else {
      bodyEl.classList.add('open');
      bodyEl.style.maxHeight = bodyEl.scrollHeight + 'px';
      toggleEl.setAttribute('aria-expanded', 'true');
      if (opts.onOpen) opts.onOpen();
    }
  });
}

function closeCollapsible(toggleEl, bodyEl) {
  if (!bodyEl.classList.contains('open')) return;
  bodyEl.style.maxHeight = bodyEl.scrollHeight + 'px';
  requestAnimationFrame(() => { bodyEl.style.maxHeight = '0px'; });
  bodyEl.classList.remove('open');
  toggleEl.setAttribute('aria-expanded', 'false');
}

function refreshCollapsibleHeight(bodyEl) {
  if (bodyEl.classList.contains('open')) bodyEl.style.maxHeight = bodyEl.scrollHeight + 'px';
}

// ---------------------------------------------------------------
// Máscara de moeda (Valor financiado / Valor entrada): formata em
// tempo real como "1.234,56", reduzindo erro de digitação. O valor
// mascarado já é entendido pelo numberField() do backend, sem precisar
// de conversão adicional ao enviar o formulário.
// ---------------------------------------------------------------
function attachCurrencyMask(input) {
  if (!input) return;
  input.addEventListener('input', () => {
    let digits = input.value.replace(/\D/g, '');
    if (!digits) { input.value = ''; return; }
    digits = digits.replace(/^0+(?=\d)/, '');
    while (digits.length < 3) digits = '0' + digits;
    const cents = digits.slice(-2);
    let intPart = digits.slice(0, -2).replace(/^0+(?=\d)/, '') || '0';
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    input.value = `${intPart},${cents}`;
  });
}

// ---------------------------------------------------------------
// Vendedor (colaboradores) — dropdown do formulário da loja, filtrado
// no backend pela própria unidade do usuário logado (listColaboradoresScoped).
// Recarregado toda vez que o card é aberto, para trazer colaboradores
// cadastrados pela Gerência desde o último carregamento.
// ---------------------------------------------------------------
async function loadColaboradoresForForm() {
  const sel = document.getElementById('vendedorSelect');
  if (!sel) return;
  const currentVal = sel.value;
  sel.innerHTML = '<option value="">Carregando...</option>';
  try {
    const res = await PagApi.request('colaboradoresList', {});
    const list = res.data || [];
    sel.innerHTML = '<option value="">Selecione</option>' + list.map(c => `<option value="${esc(c.nome)}">${esc(c.nome)}</option>`).join('');
    if (list.some(c => c.nome === currentVal)) sel.value = currentVal;
  } catch (e) {
    sel.innerHTML = '<option value="">Erro ao carregar</option>';
  }
  refreshCollapsibleHeight(document.getElementById('saleFormBody'));
}

// ---------------------------------------------------------------
// Gestão de Colaboradores (perfil GERENCIA): cadastrar, visualizar
// e ativar/desativar vendedores vinculados a uma unidade.
// ---------------------------------------------------------------
async function loadColaboradores() {
  const box = document.getElementById('colabList');
  box.innerHTML = '<div class="empty-state">Carregando...</div>';
  try {
    const res = await PagApi.request('colaboradoresList', {});
    allColaboradores = res.data || [];
    renderColabList();
  } catch (e) {
    box.innerHTML = `<div class="empty-state">Erro: ${esc(e.message)}</div>`;
  }
  refreshCollapsibleHeight(document.getElementById('colabBody'));
}

function renderColabList() {
  const box = document.getElementById('colabList');
  if (!allColaboradores.length) { box.innerHTML = '<div class="empty-state">Nenhum colaborador cadastrado.</div>'; return; }
  const byUnit = {};
  allColaboradores.forEach(c => { (byUnit[c.unidade] = byUnit[c.unidade] || []).push(c); });
  box.innerHTML = Object.keys(byUnit).map(u => {
    const meta = getUnidadeMeta(u);
    const items = byUnit[u];
    return `<div class="pag-status-group"><div class="pag-group-head">${pagChip(meta.nome, 'gold')}<span class="chip blue">${items.length}</span></div>
      <div class="tbl-wrap"><table class="pag-table"><thead><tr><th>Nome</th><th>Status</th><th></th></tr></thead><tbody>${items.map(c => `
        <tr><td><b>${esc(c.nome)}</b></td><td>${c.ativo ? '<span class="status-badge ok">ATIVO</span>' : '<span class="status-badge low">INATIVO</span>'}</td>
        <td style="text-align:right"><button type="button" class="btn-secondary pag-colab-toggle" data-id="${esc(c.id)}" data-status="${c.ativo ? 'INATIVO' : 'ATIVO'}">${c.ativo ? 'Desativar' : 'Ativar'}</button></td></tr>`).join('')}
      </tbody></table></div></div>`;
  }).join('');
  box.querySelectorAll('.pag-colab-toggle').forEach(btn => btn.addEventListener('click', () => toggleColabStatus(btn.dataset.id, btn.dataset.status)));
}

async function handleCreateColab(event) {
  event.preventDefault();
  const formEl = event.currentTarget;
  const form = new FormData(formEl);
  const payload = Object.fromEntries(form.entries());
  const msg = document.getElementById('colabMessage');
  try {
    if (!payload.nome || !payload.nome.trim()) throw new Error('Informe o nome do colaborador.');
    if (!payload.unidade) throw new Error('Selecione a unidade.');
    await PagApi.request('colaboradoresCreate', payload);
    formEl.reset();
    msg.textContent = 'Colaborador cadastrado com sucesso.';
    msg.classList.remove('hidden'); msg.classList.add('pag-success');
    await loadColaboradores();
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.remove('hidden'); msg.classList.remove('pag-success');
    refreshCollapsibleHeight(document.getElementById('colabBody'));
  }
}

async function toggleColabStatus(id, status) {
  try {
    await PagApi.request('colaboradoresSetStatus', { id, status });
    await loadColaboradores();
  } catch (err) { alert(err.message); }
}

// ---------------------------------------------------------------
// Lançamento de venda (perfil UNIDADE)
// ---------------------------------------------------------------
async function handleCreateSale(event) {
  event.preventDefault();
  // Capturado ANTES do await: em um handler assíncrono o navegador zera
  // event.currentTarget assim que o dispatch do evento termina, então usar
  // event.currentTarget depois de um "await" resulta em
  // "Cannot read properties of null (reading 'reset')".
  const formEl = event.currentTarget;
  const form = new FormData(formEl);
  const payload = Object.fromEntries(form.entries());
  const msg = document.getElementById('formMessage');
  try {
    if (parseCurrencyInput(payload.valorFinanciado) <= 0) throw new Error('Informe um valor financiado válido.');
    if (parseCurrencyInput(payload.valorEntrada) < 0) throw new Error('Informe um valor de entrada válido.');
    if (!payload.vendedor) throw new Error('Selecione o vendedor.');
    await PagApi.request('vendasCreate', payload);
    formEl.reset();
    msg.textContent = 'Solicitação lançada com sucesso.';
    msg.classList.remove('hidden'); msg.classList.add('pag-success');
    refreshCollapsibleHeight(document.getElementById('saleFormBody'));
    await loadData();
    setTimeout(() => {
      closeCollapsible(document.getElementById('saleFormToggle'), document.getElementById('saleFormBody'));
      msg.classList.add('hidden');
    }, 900);
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.remove('hidden'); msg.classList.remove('pag-success');
    refreshCollapsibleHeight(document.getElementById('saleFormBody'));
  }
}

init();
</script>
</body>
</html>
