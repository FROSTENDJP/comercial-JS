<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro — JS GRUPO</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/pagamentos.css">
</head>
<body class="pag-app">
<div class="app">
  <div class="sb-overlay" id="sbOverlay"></div>
  <div id="sidebarMount"></div>
  <div class="main" id="mainApp" style="display:none">
    <header class="topbar">
      <button class="hamburger" id="hamburger" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="tb-title">
        <span class="eyebrow">JS Grupo · Financeiro</span>
        <h1>Confirmação de Pagamentos</h1>
      </div>
    </header>
    <main class="content">
      <div class="view-head">
        <div>
          <h2 id="unitTitle">Todas as Unidades</h2>
          <p>Confira notas fiscais e atualize o status das vendas (Clientes + Revendedores).</p>
        </div>
        <span class="chip gold" id="unitChip">Liberação / Vendas</span>
      </div>

      <!-- Abas: lançamentos das lojas (unidades) vs. lançamentos de Faturamento -->
      <!-- (revendedores), que ficam segregados um do outro conforme pedido. -->
      <div class="pag-period-chips" style="margin-bottom:16px">
        <button type="button" class="pag-period-chip active" id="tabLojas">Lojas / Unidades</button>
        <button type="button" class="pag-period-chip" id="tabFaturamento">Faturamento (Revendedores)</button>
      </div>

      <div id="lojasView">
        <div class="kpi-row" id="kpiRow"></div>
        <div class="card">
          <div class="filter-bar">
            <select class="filter-select" id="filterStatus"><option value="">Todos os status</option></select>

            <input class="search-input" id="searchInput" placeholder="Buscar cliente, CPF, chassi..." />
          </div>
        </div>
        <div id="vendasList"><div class="empty-state">Carregando...</div></div>
      </div>

      <div id="faturamentoView" style="display:none">
        <div class="kpi-row" id="fatKpiRow"></div>
        <div id="fatFinList"><div class="empty-state">Carregando...</div></div>
      </div>
    </main>
  </div>
</div>
<script src="js/pagamentos-config.js"></script>
<script src="js/pagamentos-auth.js"></script>
<script src="js/pagamentos-api.js"></script>
<script src="js/pagamentos-components.js"></script>
<script src="js/pagamentos-shell.js"></script>
<script>
let currentUnidade = '', allVendas = [];

function init() {
  if (!PagAuth.isLoggedIn('financeiro')) { window.location.href = PAGAMENTOS_CONFIG.PAGES.index; return; }
  document.getElementById('sidebarMount').innerHTML = renderPagSidebar('financeiro');
  document.getElementById('mainApp').style.display = 'flex';
  bindPagMobileNav(); bindPagLogout();
  PAGAMENTOS_CONFIG.STATUS.forEach(s => {
    const o = document.createElement('option'); o.value = s.id; o.textContent = s.label;
    document.getElementById('filterStatus').appendChild(o);
  });
  renderUnitNav();
  loadData();
  ['filterStatus'].forEach(id => document.getElementById(id).addEventListener('change', renderList));
  document.getElementById('searchInput').addEventListener('input', renderList);

  document.getElementById('tabLojas').addEventListener('click', () => switchTab('lojas'));
  document.getElementById('tabFaturamento').addEventListener('click', () => switchTab('faturamento'));
}

// As duas abas ficam sempre segregadas: a de Lojas nunca mistura lançamentos
// de Faturamento (e vice-versa), porque cada uma busca de uma ação/aba
// diferente no backend (listPagamentos = BD_Pagamentos, faturamentoList =
// BD_Faturamento).
function switchTab(tab) {
  const isLojas = tab === 'lojas';
  document.getElementById('tabLojas').classList.toggle('active', isLojas);
  document.getElementById('tabFaturamento').classList.toggle('active', !isLojas);
  document.getElementById('lojasView').style.display = isLojas ? 'block' : 'none';
  document.getElementById('faturamentoView').style.display = isLojas ? 'none' : 'block';
  if (!isLojas) loadFaturamentos();
}

function renderUnitNav() {
  const nav = document.querySelector('.sb-nav');
  if (!nav || document.getElementById('unitNavBlock')) return;
  const block = document.createElement('div');
  block.id = 'unitNavBlock';
  block.innerHTML = `<div class="sb-section-lbl">UNIDADES</div>
    <div class="nav-item pag-unit-sidebar ${!currentUnidade?'active':''}" data-u="">Todas <span class="badge" id="c-all">0</span></div>
    ${PAGAMENTOS_CONFIG.UNIDADES.map(u=>`<div class="nav-item pag-unit-sidebar ${currentUnidade===u.id?'active':''}" data-u="${u.id}">${u.nome} <span class="badge" id="c-${u.id}">0</span></div>`).join('')}`;
  nav.appendChild(block);
  block.querySelectorAll('[data-u]').forEach(el => el.addEventListener('click', () => {
    currentUnidade = el.dataset.u;
    const meta = currentUnidade ? getUnidadeMeta(currentUnidade) : null;
    document.getElementById('unitTitle').textContent = meta ? meta.nome : 'Todas as Unidades';
    document.getElementById('unitChip').textContent = meta ? meta.nome : 'Liberação / Vendas';
    block.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.u === currentUnidade));
    renderList();
  }));
}

async function loadData() {
  try {
    const res = await PagApi.listVendas({});
    allVendas = res.data || [];
    updateCounts(); renderList();
  } catch (e) {
    document.getElementById('vendasList').innerHTML = `<div class="empty-state">Erro: ${esc(e.message)}</div>`;
  }
}

function updateCounts() {
  const set = (id, n) => { const el = document.getElementById(id); if (el) el.textContent = n; };
  set('c-all', allVendas.length);
  PAGAMENTOS_CONFIG.UNIDADES.forEach(u => set('c-'+u.id, allVendas.filter(v => v.unidade === u.id).length));
}

function getFiltered() {
  const st = document.getElementById('filterStatus').value;
  const q = document.getElementById('searchInput').value.toLowerCase();
  return allVendas.filter(v => {
    if (currentUnidade && v.unidade !== currentUnidade) return false;
    if (st && v.status !== st) return false;
    if (v.formType !== 'cliente') return false;
    if (q && ![v.cliente,v.cpf,v.chassi,v.vendedor].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderKpis(rows) {
  const k = id => rows.filter(v => v.status === id).length;
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card" style="--accent:#DC2626"><div class="lbl">Aguardando</div><div class="val">${k('AGUARDANDO CONFIRMACAO')}</div></div>
    <div class="kpi-card" style="--accent:#F59E0B"><div class="lbl">Faltando Info</div><div class="val">${k('FALTANDO INFORMACAO')}</div></div>
    <div class="kpi-card" style="--accent:#16A34A"><div class="lbl">Pagamento OK</div><div class="val">${k('PAGAMENTO OK')}</div></div>
    <div class="kpi-card" style="--accent:#0D9488"><div class="lbl">Concluído</div><div class="val">${k('CONCLUIDO')}</div></div>`;
}

function renderList() {
  const rows = getFiltered();
  renderKpis(rows);
  const box = document.getElementById('vendasList');
  box.innerHTML = '';
  box.appendChild(renderPagTable(rows, id => {
    const v = allVendas.find(x => x.id === id);
    if (!v) return;
    renderPagDetail(v, {
      editable: true,
      onSave: async (vId, status, obs) => {
        await PagApi.updateStatus(vId, status, obs);
        const i = allVendas.findIndex(x => x.id === vId);
        if (i >= 0) { allVendas[i].status = status; allVendas[i].observacao = obs; }
        renderList();
      }
    });
  }));
}

// ---------------------------------------------------------------
// Aba Faturamento (revendedores) — segregada da lista de lojas acima.
// Busca de BD_Faturamento via a ação faturamentoList, nunca misturada
// com listPagamentos/BD_Pagamentos.
// ---------------------------------------------------------------
let allFaturamentos = [];

async function loadFaturamentos() {
  const box = document.getElementById('fatFinList');
  box.innerHTML = '<div class="empty-state">Carregando...</div>';
  try {
    const res = await PagApi.request('faturamentoList', {});
    allFaturamentos = (res.data || []).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    renderFaturamentoKpis();
    renderFaturamentoList();
  } catch (e) {
    box.innerHTML = `<div class="empty-state">Erro: ${esc(e.message)}</div>`;
  }
}

function renderFaturamentoKpis() {
  const pend = allFaturamentos.filter(f => f.status !== 'PAGAMENTO CONFIRMADO');
  const conf = allFaturamentos.filter(f => f.status === 'PAGAMENTO CONFIRMADO');
  const totalPend = pend.reduce((s, f) => s + f.valorTotal, 0);
  document.getElementById('fatKpiRow').innerHTML = `
    <div class="kpi-card" style="--accent:#DC2626"><div class="lbl">Pendentes</div><div class="val">${pend.length}</div></div>
    <div class="kpi-card" style="--accent:#16A34A"><div class="lbl">Confirmados</div><div class="val">${conf.length}</div></div>
    <div class="kpi-card" style="--accent:#FF6B00"><div class="lbl">Valor Pendente</div><div class="val" style="font-size:22px">${formatCurrency(totalPend)}</div></div>`;
}

function renderFaturamentoList() {
  const box = document.getElementById('fatFinList');
  if (!allFaturamentos.length) { box.innerHTML = '<div class="empty-state">Nenhum lançamento de faturamento ainda.</div>'; return; }
  box.innerHTML = `<div class="tbl-wrap"><table class="pag-table"><thead><tr>
      <th>Revendedor</th><th>Cidade</th><th>Itens</th><th class="num">Valor Total</th><th>Lançado por</th><th>Status</th><th></th>
    </tr></thead><tbody>${allFaturamentos.map(f => `
      <tr data-id="${esc(f.id)}"><td><b>${esc(f.revendedor)}</b><div class="row-sub">${formatDate(f.timestamp)}</div></td>
      <td>${esc(f.cidade)}</td>
      <td>${f.itens.map(it => `${it.quantidade}x ${esc(it.modelo)}`).join(', ')}</td>
      <td class="num"><b>${formatCurrency(f.valorTotal)}</b></td>
      <td>${esc(f.criadoPor)}</td>
      <td>${f.status === 'PAGAMENTO CONFIRMADO' ? '<span class="status-badge ok">CONFIRMADO</span>' : '<span class="status-badge low">PENDENTE</span>'}</td>
      <td style="text-align:right">${f.status === 'PAGAMENTO CONFIRMADO' ? '' : `<button type="button" class="btn-primary fat-confirm-btn" data-id="${esc(f.id)}">Confirmar pagamento</button>`}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
  box.querySelectorAll('.fat-confirm-btn').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    confirmFaturamento(btn.dataset.id);
  }));
}

async function confirmFaturamento(id) {
  if (!confirm('Confirmar o pagamento deste lançamento de faturamento?')) return;
  try {
    await PagApi.request('faturamentoConfirmar', { id });
    await loadFaturamentos();
  } catch (err) { alert(err.message); }
}

init();
</script>
</body>
</html>
